# fable2-nx (2026-11-15): Fable 2's final composite (the scene, its bloom and the colour table to the 1280x720 target,
# PS 27890441DB0DEB15): SMAA and the internal resolution (banjo_renut_render_height_*) work on the frames that have it;
# without it neither ran (the base's default names Nuts & Bolts' composite).
# fable2-nx (2026-11-18): and its other form, 29033524A1B6DFB0, which town gameplay draws instead: without it the
# renderer saw no composite for 30 frames, took the frames for a menu and drew the 3D at 1280x720 (the log's "Render
# resolution 1280x720 (1x)" for minutes at a time; 1120x720 scene targets in the GPU profile instead of 840x540).
# fable2-nx (2026-11-19): a third, ADC16EEFB066FE4E (the run of 00:39: once a frame at 1280x720 with the HUD's passes
# after it, where the other two were, while the renderer drew at 1x).
# fable2-nx (2026-11-20): three more forms, 2799E0214B191AE5, E8ED72186E8811AD and 321314426201DDE9 (the run of 22:17: 308 of
# 1390 s drawn at 1x, frames of 52-66 ms on the GPU against about 38, each with one of these once a frame at 1280x720).
# fable2-nx (2026-11-23): all sixteen forms, from the shader bank (tools/fable2_shader_bank.py): the composite's four
# groups of four pixel shaders (groups 125-128 of ShadersRelease.sbk). The run of 2026-11-21 still drew 642 of 2722 s
# at 1x, with E3827978D770EF6E as its composite.
fable2_smaa_after_ps = "27890441DB0DEB15,29033524A1B6DFB0,ADC16EEFB066FE4E,217844A990E28DCB,BF6619DC3709CD17,E3827978D770EF6E,2799E0214B191AE5,90DB4642466FCDCB,E8ED72186E8811AD,E8300669482A6F02,4A322408AFF3D0AF,D539A110142867DC,321314426201DDE9,F409D25D50367D63,1297D258066AEDD7,8D71BC4F80E5532E"
