# Fable 2 NX for the Switch: the fixed settings, compiled into the NRO (app/CMakeLists.txt, src/renut_app.h
# BuiltInConfig) and applied before the SD card's fable2.toml, which holds the player's options (app/fable2_switch.toml).
# fable2-nx (2026-11-12): the base's (katamari-nx's renut_pgo.toml, the settings its released profile was taken with),
# unchanged but for: the machine-copy keys of Katamari's addresses (banjo_cpu_native_sub_*: other functions here) left
# out, and the log ON while the port is brought up (log_level / log_file_writer; "off" and false again for a release).
