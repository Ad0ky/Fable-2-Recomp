# fable2-nx (Fable II, Xbox 360 GOTY 1.5.0, XDK 2.0.7645) - ReXGlue codegen configuration on renut_nx_ultimate_base.
# The project keeps the base's internal name "renut" (generated/renut_*.h, the renut / renut_recomp targets,
# out/renut_image.bin) so the base's CMake, post-codegen passes and renderer glue work unchanged; the NRO and the SD
# folder are fable2-nx.

includes = [
"config/fable2_funcs.toml",
"config/fable2_switch_tables.toml",
"config/renut_hooks.toml",
]

# banjo-nx's optimised codegen keys that need no per-game audit (they change how the C++ is written, not what the
# guest sees; banjo-nx's renut_config.toml carries the reasoning and the console measurements for each):
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
fp_moves_modeless = true
# The register "diet" keys, as the base has them. Fable 2's own manifest (himdo's, run on the PC and in fable2-nx on
# the console) already had cr/ctr/xer/reserved_as_local, skip_msr, non_argument_as_local and non_volatile_as_local on
# with no keep list. The base's audits run on every Docker build anyway (tools/nx/codegen-audit.sh: read_before_write.py,
# non_argument_audit.py, cc_entry_census.py, cc_exit_census.py; out/audit), and what they list is kept here.
non_volatile_as_local = true
# v64-v127 in ctx in every function (katamari-nx: a codec that keeps constants in VMX128 registers across its calls
# read zeros as locals; about 40 functions name a register above v31, so keeping the range costs almost nothing).
non_volatile_as_local_keep = ["v64-v127"]
elide_lr_stores = true
skip_lr = true  # himdo's manifest
non_argument_as_local = true
# Functions whose r0/r2/r11/r12/f0/v32-v63 cross a call (tools/non_argument_audit.py ENTRY / RET): none listed yet.
non_argument_as_local_keep = [
]

# setjmp / longjmp (himdo's manifest): longjmp 0x82CA9260 restores the full guest state from the jmp_buf and calls
# RtlUnwind; setjmp 0x83000200 stores it in the layout longjmp restores.
setjmp_address = 0x83000200
longjmp_address = 0x82CA9260

project_name = "renut"
file_path = "assets/default.xex"
out_directory_path = "generated"
